<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טטריס</title>
    <style>
        canvas {
            border: 1px solid black;
            display: block;
            margin: 0 auto;
            background: #eee;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const context = canvas.getContext("2d");

        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 30;
        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

        const shapes = [
            [[1, 1, 1], [0, 1, 0]], // T
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[1, 1, 0], [0, 1, 1]], // S
            [[0, 1, 1], [1, 1, 0]], // Z
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]]  // J
        ];

        let currentPiece = createPiece();
        let currentX = Math.floor(COLS / 2) - 1;
        let currentY = 0;

        function createPiece() {
            const shape = shapes[Math.floor(Math.random() * shapes.length)];
            return shape;
        }

        function drawBoard() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        context.fillStyle = "black";
                        context.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                }
            }
        }

        function drawPiece() {
            context.fillStyle = "red";
            currentPiece.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        context.fillRect((currentX + c) * BLOCK_SIZE, (currentY + r) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                });
            });
        }

        function dropPiece() {
            if (canMove(0, 1)) {
                currentY++;
            } else {
                merge();
                clearLines();
                currentPiece = createPiece();
                currentX = Math.floor(COLS / 2) - 1;
                currentY = 0;
                if (!canMove(0, 0)) {
                    alert("Game Over");
                    resetGame();
                }
            }
        }

        function canMove(dx, dy) {
            return currentPiece.every((row, r) => {
                return row.every((value, c) => {
                    if (!value) return true;
                    const newX = currentX + c + dx;
                    const newY = currentY + r + dy;
                    return (
                        newX >= 0 &&
                        newX < COLS &&
                        newY < ROWS &&
                        (newY >= 0 && !board[newY][newX])
                    );
                });
            });
        }

        function merge() {
            currentPiece.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        board[currentY + r][currentX + c] = 1;
                    }
                });
            });
        }

        function clearLines() {
            board = board.filter(row => row.some(value => value === 0));
            while (board.length < ROWS) {
                board.unshift(Array(COLS).fill(0));
            }
        }

        function resetGame() {
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            currentPiece = createPiece();
            currentX = Math.floor(COLS / 2) - 1;
            currentY = 0;
            draw();
        }

        function draw() {
            context.clearRect(0, 0, canvas.width, canvas.height);
            drawBoard();
            drawPiece();
        }

        setInterval(() => {
            dropPiece();
            draw();
        }, 1000);
    </script>
</body>
</html>
